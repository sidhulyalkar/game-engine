name: Evidence Broker CI

on:
  push:
    branches:
      - agent/v0.6-evidence-broker-integration
    paths:
      - '.github/workflows/evidence-broker-ci.yml'
      - 'src/game_engine/autonomous.py'
      - 'src/game_engine/evidence_broker.py'
      - 'src/game_engine/behavior_repair.py'
      - 'src/game_engine/source_audit.py'
      - 'src/game_engine/action_causality.py'
      - 'src/game_engine/action_policy.py'
      - 'src/game_engine/playtest.py'
      - 'src/game_engine/structured_playtest.py'
      - 'src/game_engine/visual_playtest.py'
      - 'src/game_engine/restart_playtest.py'
      - 'src/game_engine/game_spec.py'
      - 'src/game_engine/schema.py'
      - 'tests/game_corpus/restart-good/**'
      - 'tests/game_corpus/restart-stale/**'
      - 'tests/test_evidence_broker.py'
      - 'tests/test_autonomous_behavioral_gate.py'
      - 'tests/test_behavior_repair.py'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'src/game_engine/autonomous.py'
      - 'src/game_engine/evidence_broker.py'
      - 'src/game_engine/behavior_repair.py'
      - 'src/game_engine/source_audit.py'
      - 'src/game_engine/action_causality.py'
      - 'src/game_engine/action_policy.py'
      - 'src/game_engine/playtest.py'
      - 'src/game_engine/structured_playtest.py'
      - 'src/game_engine/visual_playtest.py'
      - 'src/game_engine/restart_playtest.py'
      - 'src/game_engine/game_spec.py'
      - 'src/game_engine/schema.py'
      - 'tests/game_corpus/restart-good/**'
      - 'tests/game_corpus/restart-stale/**'
      - 'tests/test_evidence_broker.py'
      - 'tests/test_autonomous_behavioral_gate.py'
      - 'tests/test_behavior_repair.py'
      - 'pyproject.toml'

permissions:
  contents: read

concurrency:
  group: evidence-broker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evidence lab
        run: python -m pip install -e '.[reality]' pytest

      - name: Unit contracts
        run: pytest -q

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Build synthetic Browser Reality qualifications
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for build_id, root in [('restart-good','/tmp/reality-good'), ('restart-stale','/tmp/reality-stale')]:
              p = Path(root); p.mkdir(parents=True, exist_ok=True)
              q = {
                  'browsers':['chromium','firefox','webkit'],
                  'full_pass_build_ids':[build_id],
                  'matrix':{build_id:{'chromium':True,'firefox':True,'webkit':True}},
                  'initial_text_matrix':{build_id:{'chromium':'','firefox':'','webkit':''}},
              }
              (p/'qualification.json').write_text(json.dumps(q))
              rows = [
                  {'build_id':build_id,'provider':'fixture','browser':browser,'ok':True}
                  for browser in ('chromium','firefox','webkit')
              ]
              (p/'reality.json').write_text(json.dumps(rows))
          PY

      - name: Run explicit behavioral evidence broker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from game_engine.evidence_broker import EvidenceBroker

          broker = EvidenceBroker(browsers=('chromium',), sample_interval_ms=120)
          good = broker.run(
              Path('tests/game_corpus/restart-good'),
              Path('/tmp/broker-good'),
              Path('/tmp/reality-good'),
          )
          stale = broker.run(
              Path('tests/game_corpus/restart-stale'),
              Path('/tmp/broker-stale'),
              Path('/tmp/reality-stale'),
          )
          print(json.dumps({'good':good, 'stale':stale}, indent=2))
          assert good['all_probes_completed'] is True, good
          assert good['behaviorally_qualified_build_ids'] == ['restart-good'], good
          assert good['llm_critic_eligible_build_ids'] == ['restart-good'], good
          assert stale['all_probes_completed'] is True, stale
          assert stale['behaviorally_qualified_build_ids'] == [], stale
          assert stale['behavioral_repair_build_ids'] == ['restart-stale'], stale
          assert stale['llm_critic_eligible_build_ids'] == [], stale
          good_q = json.loads(Path('/tmp/broker-good/critic-reality/qualification.json').read_text())
          stale_q = json.loads(Path('/tmp/broker-stale/critic-reality/qualification.json').read_text())
          assert good_q['full_pass_build_ids'] == ['restart-good'], good_q
          assert stale_q['full_pass_build_ids'] == [], stale_q
          assert good_q['behavioral_gate_applied'] is True, good_q
          assert stale_q['behavioral_gate_applied'] is True, stale_q
          PY

      - name: Prove filtered reality controls critic spend
        run: |
          python - <<'PY'
          import json
          from dataclasses import dataclass
          from pathlib import Path
          from game_engine.schema import Brief, Concept
          from game_engine.source_audit import DIMENSIONS, SourceGameplayLab

          @dataclass
          class Spec:
              name: str

          class Critic:
              def __init__(self): self.calls = 0
              def complete(self, system, prompt):
                  self.calls += 1
                  return json.dumps({
                      'scores': {name: 8 for name in DIMENSIONS},
                      'verdict': 'advance',
                      'summary': 'clean fixture',
                      'findings': [],
                  })

          brief = Brief(theme='Unicorns and Rainbows')
          concept = Concept(
              concept_id='fixture', title='Fixture', hook='fixture', core_mechanic='press to mutate',
              player_goal='mutate then restart', controls='Space', core_loop=['press','restart'],
              escalation=['repeat'], visual_grammar='canvas', audio_grammar='bleep',
              category_fit=['desktop'], byte_hypothesis='tiny', risks=[], tags=[]
          )

          good_a, good_b = Critic(), Critic()
          good = SourceGameplayLab([(Spec('critic-a'), good_a), (Spec('critic-b'), good_b)], max_workers=2).run(
              brief, concept,
              Path('tests/game_corpus/restart-good'), Path('/tmp/audit-good'),
              Path('/tmp/broker-good/critic-reality')
          )
          assert good_a.calls == 1 and good_b.calls == 1, (good_a.calls, good_b.calls, good)
          assert good['llm_critic_eligible_build_ids'] == ['restart-good'], good
          assert good['advance_build_ids'] == ['restart-good'], good

          stale_a, stale_b = Critic(), Critic()
          try:
              SourceGameplayLab([(Spec('critic-a'), stale_a), (Spec('critic-b'), stale_b)], max_workers=2).run(
                  brief, concept,
                  Path('tests/game_corpus/restart-stale'), Path('/tmp/audit-stale'),
                  Path('/tmp/broker-stale/critic-reality')
              )
          except ValueError as exc:
              assert 'no cross-browser-qualified builds' in str(exc), exc
          else:
              raise AssertionError('behaviorally failed build unexpectedly reached source audit')
          assert stale_a.calls == 0 and stale_b.calls == 0, (stale_a.calls, stale_b.calls)
          print(json.dumps({'good':good, 'stale_critic_calls':[stale_a.calls, stale_b.calls]}, indent=2))
          PY

      - name: Prove bounded behavioral repair can re-enter evidence funnel
        run: |
          python - <<'PY'
          import json
          from dataclasses import dataclass
          from pathlib import Path
          from game_engine.behavior_repair import BehavioralRepairForge
          from game_engine.evidence_broker import EvidenceBroker
          from game_engine.reality import BrowserRealityLab
          from game_engine.schema import Brief, Concept

          @dataclass
          class Spec:
              name: str

          class Repairer:
              def __init__(self, html):
                  self.html = html
                  self.calls = 0
              def complete(self, system, prompt):
                  self.calls += 1
                  assert 'fresh-run restart contract failed' in prompt
                  return self.html

          repaired_html = Path('tests/game_corpus/restart-good/game/index.html').read_text()
          repairer = Repairer(repaired_html)
          concept = Concept(
              concept_id='fixture', title='Fixture', hook='fixture', core_mechanic='press to mutate',
              player_goal='mutate then restart', controls='Space, R', core_loop=['press','restart'],
              escalation=['repeat'], visual_grammar='canvas', audio_grammar='bleep',
              category_fit=['desktop'], byte_hypothesis='tiny', risks=[], tags=[]
          )
          repairs = BehavioralRepairForge([(Spec('repairer'), repairer)], max_workers=1).build(
              Brief(theme='Unicorns and Rainbows', primary_category='desktop'),
              concept,
              Path('tests/game_corpus/restart-stale'),
              Path('/tmp/broker-stale'),
              Path('/tmp/behavior-repairs'),
              max_parents=1,
          )
          assert repairer.calls == 1, repairer.calls
          assert len(repairs) == 1 and repairs[0].ok, repairs
          child_id = repairs[0].build_id

          reality = BrowserRealityLab(browsers=('chromium',), timeout_ms=10000).run(
              Path('/tmp/behavior-repairs'), Path('/tmp/behavior-repair-reality')
          )
          assert reality['full_pass_build_ids'] == [child_id], reality

          evidence = EvidenceBroker(browsers=('chromium',), sample_interval_ms=120).run(
              Path('/tmp/behavior-repairs'),
              Path('/tmp/behavior-repair-evidence'),
              Path('/tmp/behavior-repair-reality'),
          )
          assert evidence['behaviorally_qualified_build_ids'] == [child_id], evidence
          assert evidence['behavioral_repair_build_ids'] == [], evidence
          assert evidence['llm_critic_eligible_build_ids'] == [child_id], evidence
          print(json.dumps({
              'parent':'restart-stale',
              'child':child_id,
              'bytes':repairs[0].compressed_bytes,
              'reality':reality,
              'behavior':evidence,
          }, indent=2))
          PY
