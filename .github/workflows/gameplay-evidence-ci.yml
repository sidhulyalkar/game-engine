name: Gameplay Evidence CI

on:
  push:
    branches:
      - agent/v0.3-gameplay-evidence
    paths:
      - '.github/workflows/gameplay-evidence-ci.yml'
      - 'src/game_engine/playtest.py'
      - 'src/game_engine/structured_playtest.py'
      - 'src/game_engine/visual_playtest.py'
      - 'src/game_engine/action_policy.py'
      - 'src/game_engine/game_spec.py'
      - 'src/game_engine/prototype.py'
      - 'src/game_engine/cli.py'
      - 'tests/game_corpus/**'
      - 'tests/test_playtest.py'
      - 'tests/test_visual_playtest.py'
      - 'tests/test_action_policy.py'
      - 'tests/test_game_spec.py'
      - 'tests/test_prototype.py'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'src/game_engine/playtest.py'
      - 'src/game_engine/structured_playtest.py'
      - 'src/game_engine/visual_playtest.py'
      - 'src/game_engine/action_policy.py'
      - 'src/game_engine/game_spec.py'
      - 'src/game_engine/prototype.py'
      - 'src/game_engine/cli.py'
      - 'tests/game_corpus/**'
      - 'tests/test_playtest.py'
      - 'tests/test_visual_playtest.py'
      - 'tests/test_action_policy.py'
      - 'tests/test_game_spec.py'
      - 'tests/test_prototype.py'
      - 'pyproject.toml'

permissions:
  contents: read

concurrency:
  group: gameplay-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evidence lab
        run: python -m pip install -e '.[reality]' pytest

      - name: Unit contracts
        run: pytest -q

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run known-good telemetry fixture
        run: |
          game-engine playtest tests/game_corpus/telemetry-good \
            --out /tmp/gameplay-evidence \
            --browsers chromium \
            --sample-interval-ms 120

      - name: Qualify telemetry fixture expectations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('tests/game_corpus/telemetry-good/case.json').read_text())['expected']
          summary = json.loads(Path('/tmp/gameplay-evidence/playtest-summary.json').read_text())
          build = next(row for row in summary['builds'] if row['build_id'] == 'telemetry-good')
          sweep = build['policies']['chromium']['sweep']
          null = build['policies']['chromium']['null']
          assert build['instrumented'] is expected['instrumented'], build
          assert build['mechanically_observable'] is expected['mechanically_observable'], build
          assert build['violations'] == expected['violations'], build
          assert summary['active_policy_source'] == 'legacy-generic-sweep', summary
          assert summary['action_program'] == [], summary
          assert (null['progress_delta'] or 0) == expected['null_progress_delta'], null
          assert (sweep['core_mechanic_activations'] or 0) >= expected['active_core_mechanic_activations_min'], sweep
          assert sweep['visible_change'] is True, sweep
          print(json.dumps(summary, indent=2))
          PY

      - name: Run structured pointer-control fixture
        run: |
          python -m game_engine.visual_playtest tests/game_corpus/pointer-controls \
            --out /tmp/pointer-controls-evidence \
            --browsers chromium \
            --sample-interval-ms 120

      - name: Qualify authoritative pointer motion and buttons
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('tests/game_corpus/pointer-controls/case.json').read_text())['expected']
          summary = json.loads(Path('/tmp/pointer-controls-evidence/playtest-summary.json').read_text())
          build = next(row for row in summary['builds'] if row['build_id'] == 'pointer-controls')
          sweep = build['policies']['chromium']['sweep']
          assert summary['active_policy_source'] == expected['active_policy_source'], summary
          assert build['instrumented'] is expected['instrumented'], build
          assert build['mechanically_observable'] is expected['mechanically_observable'], build
          assert build['independently_observable'] is expected['independently_observable'], build
          assert sweep['progress_delta'] == expected['progress_delta'], sweep
          assert sweep['score_delta'] == expected['score_delta'], sweep
          commands = summary['action_program']
          assert any(row['kind'] == 'pointer_move' for row in commands), commands
          assert any(row['binding'] == expected['secondary_binding'] for row in commands), commands
          assert any(row['command'] == 'pointer_click' and row['binding'] == 'PrimaryPointer' for row in commands), commands
          assert any(row['command'] == 'pointer_click' and row['binding'] == 'SecondaryPointer' for row in commands), commands
          print(json.dumps(summary, indent=2))
          PY

      - name: Run canvas-only causal visual fixture
        run: |
          python -m game_engine.visual_playtest tests/game_corpus/canvas-only \
            --out /tmp/canvas-evidence \
            --browsers chromium \
            --sample-interval-ms 120

      - name: Qualify independent canvas evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('tests/game_corpus/canvas-only/case.json').read_text())['expected']
          summary = json.loads(Path('/tmp/canvas-evidence/playtest-summary.json').read_text())
          build = next(row for row in summary['builds'] if row['build_id'] == 'canvas-only')
          null = build['policies']['chromium']['null']
          sweep = build['policies']['chromium']['sweep']
          assert build['instrumented'] is expected['instrumented'], build
          assert build['mechanically_observable'] is expected['mechanically_observable'], build
          assert build['violations'] == expected['violations'], build
          assert null['visible_change_fraction'] == expected['null_visible_change_fraction'], null
          assert sweep['independent_visual_response'] is expected['independent_visual_response'], sweep
          assert build['independently_observable'] is True, build
          assert build['telemetry_visual_contradiction'] is False, build
          assert (sweep['core_mechanic_activations'] or 0) >= expected['active_core_mechanic_activations_min'], sweep
          assert 'canvas-only' in summary['independently_observable_build_ids'], summary
          print(json.dumps(summary, indent=2))
          PY

      - name: Run telemetry-contradiction fixture
        run: |
          python -m game_engine.visual_playtest tests/game_corpus/telemetry-liar \
            --out /tmp/telemetry-liar-evidence \
            --browsers chromium \
            --sample-interval-ms 120

      - name: Preserve telemetry versus player-visible disagreement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('tests/game_corpus/telemetry-liar/case.json').read_text())['expected']
          summary = json.loads(Path('/tmp/telemetry-liar-evidence/playtest-summary.json').read_text())
          build = next(row for row in summary['builds'] if row['build_id'] == 'telemetry-liar')
          null = build['policies']['chromium']['null']
          sweep = build['policies']['chromium']['sweep']
          assert build['instrumented'] is expected['instrumented'], build
          assert build['mechanically_observable'] is expected['mechanically_observable'], build
          assert build['independent_visual_response'] is expected['independent_visual_response'], build
          assert build['independently_observable'] is False, build
          assert build['telemetry_visual_contradiction'] is True, build
          assert build['violations'] == expected['violations'], build
          assert null['visible_change_fraction'] == expected['null_visible_change_fraction'], null
          assert sweep['visible_change_fraction'] == expected['sweep_visible_change_fraction'], sweep
          assert (sweep['core_mechanic_activations'] or 0) >= expected['active_core_mechanic_activations_min'], sweep
          assert 'telemetry-liar' in summary['telemetry_visual_contradiction_build_ids'], summary
          assert 'telemetry-liar' not in summary['independently_observable_build_ids'], summary
          print(json.dumps(summary, indent=2))
          PY

      - name: Run autoplay causal-adversary fixture
        run: |
          python -m game_engine.visual_playtest tests/game_corpus/autoplay \
            --out /tmp/autoplay-evidence \
            --browsers chromium \
            --sample-interval-ms 120

      - name: Reject autoplay as independent player agency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('tests/game_corpus/autoplay/case.json').read_text())['expected']
          summary = json.loads(Path('/tmp/autoplay-evidence/playtest-summary.json').read_text())
          build = next(row for row in summary['builds'] if row['build_id'] == 'autoplay')
          null = build['policies']['chromium']['null']
          sweep = build['policies']['chromium']['sweep']
          assert build['instrumented'] is expected['instrumented'], build
          assert build['mechanically_observable'] is expected['mechanically_observable'], build
          assert build['independent_visual_response'] is expected['independent_visual_response'], build
          assert build['independently_observable'] is expected['independently_observable'], build
          assert build['telemetry_visual_contradiction'] is expected['telemetry_visual_contradiction'], build
          assert build['violations'] == expected['violations'], build
          assert (sweep['core_mechanic_activations'] or 0) >= expected['active_core_mechanic_activations_min'], sweep
          assert sweep['visible_change_fraction'] <= null['visible_change_fraction'] + 0.05, (null, sweep)
          assert 'autoplay' not in summary['independently_observable_build_ids'], summary
          assert 'autoplay' in summary['telemetry_visual_contradiction_build_ids'], summary
          print(json.dumps(summary, indent=2))
          PY
