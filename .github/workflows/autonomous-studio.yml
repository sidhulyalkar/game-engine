name: Autonomous NVIDIA Studio

on:
  workflow_dispatch:
    inputs:
      brief:
        description: Brief JSON to evolve
        required: false
        default: examples/briefs/js13k-2026.json
      seed:
        description: Reproducible studio seed
        required: false
        default: '13'
  schedule:
    - cron: '17 10 * * *'
  push:
    branches:
      - main
      - agent/v0.1-swarm-foundry
    paths:
      - '.github/workflows/autonomous-studio.yml'
      - 'studio.nvidia.json'
      - 'examples/briefs/**'
      - 'src/game_engine/**'
      - 'tests/**'
      - 'pyproject.toml'

permissions:
  contents: read

concurrency:
  group: autonomous-nvidia-studio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      BRIEF: ${{ github.event.inputs.brief || 'examples/briefs/js13k-2026.json' }}
      STUDIO_SEED: ${{ github.event.inputs.seed || github.run_number }}
      RUN_ROOT: runs/autonomous
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install studio
        run: python -m pip install -e '.[reality]' pytest

      - name: Validate secret and configuration
        shell: bash
        run: |
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "::error::Repository Actions secret NVIDIA_API_KEY is not available to this workflow."
            exit 2
          fi
          test -f "$BRIEF"
          test -f studio.nvidia.json
          python - <<'PY'
          from pathlib import Path
          from game_engine.config import load_provider_specs
          specs = load_provider_specs(Path('studio.nvidia.json'))
          assert len(specs) >= 3, 'autonomous roster must contain at least three enabled providers'
          assert len({s.model for s in specs}) >= 3, 'autonomous roster must be model-diverse'
          print('configured models:', ', '.join(s.model for s in specs))
          PY

      - name: Unit and contract tests
        run: pytest -q

      - name: Deterministic exploration baseline
        run: |
          mkdir -p "$RUN_ROOT"
          game-engine ideate "$BRIEF" \
            --out "$RUN_ROOT/deterministic" \
            --seed "$STUDIO_SEED" \
            --concepts 32

      - name: NVIDIA heterogeneous swarm ideation
        run: |
          game-engine swarm-ideate "$BRIEF" \
            --providers studio.nvidia.json \
            --out "$RUN_ROOT/swarm" \
            --seed "$STUDIO_SEED" \
            --seeds 24 \
            --per-call 3 \
            --workers 6

      - name: Qualify swarm health
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('runs/autonomous/swarm')
          manifest = json.loads((root / 'manifest.json').read_text())
          providers = manifest.get('successful_providers', [])
          successes = int(manifest.get('successful_assignments', 0))
          population = int(manifest.get('population_size', 0))
          if len(providers) < 2:
              raise SystemExit(f'need >=2 successful model providers, got {providers}')
          if successes < 6:
              raise SystemExit(f'need >=6 successful specialist assignments, got {successes}')
          if population <= 24:
              raise SystemExit(f'LLM swarm added no qualified concepts; population={population}')
          if not (root / 'winner.json').exists():
              raise SystemExit('winner.json missing')
          print(f'swarm qualified: providers={len(providers)} assignments={successes} population={population}')
          PY

      - name: Multi-model prototype race
        run: |
          game-engine swarm-build "$RUN_ROOT/swarm/winner.json" \
            --providers studio.nvidia.json \
            --out "$RUN_ROOT/builds" \
            --workers 3

      - name: Qualify prototype race
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          results = json.loads(Path('runs/autonomous/builds/builds.json').read_text())
          good = [r for r in results if r.get('ok')]
          if not good:
              errors = [r.get('error') for r in results]
              raise SystemExit(f'no runnable byte-qualified prototype survived: {errors}')
          print('byte-qualified prototypes:', [(r['provider'], r['compressed_bytes']) for r in good])
          PY

      - name: Install browser engines
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Browser Reality Lab
        run: |
          game-engine reality-check "$RUN_ROOT/builds" \
            --out "$RUN_ROOT/reality" \
            --browsers chromium,firefox,webkit \
            --timeout-ms 12000

      - name: Qualify cross-browser reality and write run summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('runs/autonomous')
          reality = json.loads((root / 'reality' / 'qualification.json').read_text())
          full_pass = reality.get('full_pass_build_ids', [])
          if not full_pass:
              raise SystemExit(f'no prototype passed all requested browsers: {reality.get("matrix")}')
          builds = json.loads((root / 'builds' / 'builds.json').read_text())
          good = [r for r in builds if r.get('ok')]
          winner = json.loads((root / 'swarm' / 'winner.json').read_text())
          summary = {
              'concept': winner['concept']['title'],
              'concept_id': winner['concept']['concept_id'],
              'prototype_survivors': len(good),
              'cross_browser_survivors': len(full_pass),
              'cross_browser_build_ids': full_pass,
              'browser_matrix': reality.get('matrix', {}),
              'smallest_survivor_bytes': min(r['compressed_bytes'] for r in good),
              'largest_headroom_bytes': max(r['byte_headroom'] for r in good),
              'browser_reality_lab_passed': True,
              'promotion_blocked_until_playtest_evidence': True,
          }
          (root / 'run-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

      - name: Write Actions summary
        if: always()
        shell: bash
        run: |
          echo "## Autonomous Game Studio" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Seed: \`${STUDIO_SEED}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Brief: \`${BRIEF}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUN_ROOT/run-summary.json" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUN_ROOT/run-summary.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Browser Reality Lab is now a technical gate. Final promotion remains blocked until gameplay/playtest evidence exists." >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve complete tournament evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-studio-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/autonomous
          if-no-files-found: warn
          retention-days: 30
