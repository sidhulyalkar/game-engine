name: Autonomous NVIDIA Studio

on:
  workflow_dispatch:
    inputs:
      brief:
        description: Brief JSON to evolve
        required: false
        default: examples/briefs/js13k-2026.json
      seed:
        description: Reproducible studio seed
        required: false
        default: '13'
  schedule:
    - cron: '17 10 * * *'
  push:
    branches:
      - main
      - agent/v0.1-swarm-foundry
    paths:
      - '.github/workflows/autonomous-studio.yml'
      - 'studio.nvidia*.json'
      - 'examples/briefs/**'
      - 'src/game_engine/**'
      - 'tests/**'
      - 'pyproject.toml'

permissions:
  contents: read

concurrency:
  group: autonomous-nvidia-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      BRIEF: ${{ github.event.inputs.brief || 'examples/briefs/js13k-2026.json' }}
      STUDIO_SEED: ${{ github.event.inputs.seed || github.run_number }}
      RUN_ROOT: runs/autonomous
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install studio
        run: python -m pip install -e '.[reality]' pytest

      - name: Validate secret and configuration files
        shell: bash
        run: |
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "::error::Repository Actions secret NVIDIA_API_KEY is not available."
            exit 2
          fi
          test -f "$BRIEF"
          for cfg in studio.nvidia.json studio.nvidia.rescue.json studio.nvidia.build.json studio.nvidia.audit.json studio.nvidia.repair.json; do
            test -f "$cfg"
          done

      - name: Unit and contract tests
        run: pytest -q

      - name: Run evidence-gated autonomous tournament
        run: |
          game-engine autonomous-tournament "$BRIEF" \
            --out "$RUN_ROOT" \
            --seed "$STUDIO_SEED" \
            --primary-providers studio.nvidia.json \
            --rescue-providers studio.nvidia.rescue.json \
            --build-providers studio.nvidia.build.json \
            --audit-providers studio.nvidia.audit.json \
            --repair-providers studio.nvidia.repair.json \
            --browsers chromium,firefox,webkit \
            --install-browsers-on-demand

      - name: Write Actions summary
        if: always()
        shell: bash
        run: |
          echo "## Autonomous Game Studio" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Seed: \`${STUDIO_SEED}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Brief: \`${BRIEF}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUN_ROOT/stage-journal.json" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Stage journal" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUN_ROOT/stage-journal.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUN_ROOT/run-summary.json" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Qualified run summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUN_ROOT/run-summary.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "$RUN_ROOT/failure.json" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Fail-closed evidence" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUN_ROOT/failure.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Final promotion remains blocked until behavioral and player-facing evidence exists." >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve complete tournament evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-studio-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/autonomous
          if-no-files-found: warn
          retention-days: 30
