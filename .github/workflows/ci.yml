name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: pytest -q
      - run: game-engine ideate examples/briefs/js13k-2026.json --out /tmp/foundry-smoke --seed 13 --concepts 16
