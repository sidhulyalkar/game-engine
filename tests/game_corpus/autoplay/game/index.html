<!doctype html><html><head><meta charset="utf-8"><title>Autoplay Decoy</title><style>html,body{margin:0;background:#080812;color:#fff;font:16px system-ui}body{display:grid;place-items:center;min-height:100vh;text-align:center}canvas{display:block;border:1px solid #777;background:#111;margin:auto}</style></head><body><div><canvas id="game" width="480" height="270"></canvas><p>WASD / Arrows / Space · Inputs are accepted, but this fixture plays itself</p></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),started=performance.now();let actions=0,last=null,core=0;const log=[];
function now(){return performance.now()-started}function ev(type){log.push({type,at_ms:now()});if(log.length>256)log.shift()}
function score(){return Math.floor(now()/250)}function draw(){const t=now(),s=score(),px=60+(t/6)%360,py=135+Math.sin(t/180)*38;x.fillStyle='#111';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff';x.font='18px system-ui';x.fillText('AUTOPLAY DECOY',158,42);x.strokeStyle='#555';x.beginPath();x.moveTo(40,135);x.lineTo(440,135);x.stroke();x.fillStyle='#ffdc6a';x.beginPath();x.moveTo(px,py-16);x.lineTo(px-10,py+12);x.lineTo(px+10,py+12);x.closePath();x.fill();x.strokeStyle='#8ff';x.lineWidth=4;x.beginPath();x.moveTo(40,205);x.lineTo(40+Math.min(400,s*8),205);x.stroke();requestAnimationFrame(draw)}
function act(){actions++;last=now();core++;ev('action_accepted');ev('core_mechanic_activation')}
const keys=new Set(['w','a','s','d','ArrowUp','ArrowLeft','ArrowDown','ArrowRight',' ']);addEventListener('keydown',e=>{if(keys.has(e.key)){e.preventDefault();act()}});ev('run_start');draw();
window.__GAME_ENGINE_TELEMETRY__={schema_version:'0.1',snapshot:()=>{const t=now(),s=score();return{elapsed_ms:t,tick:Math.floor(t/16.6667),state:'playing',alive:true,game_over:false,score:s,progress:Math.min(1,s/20),restart_count:0,entity_count:1,action_count:actions,last_action_ms:last,core_mechanic_activations:core,progression_transitions:0,state_hash:`playing:${s}:${Math.floor(t/100)}`}},events:()=>log.slice()};
</script></body></html>
