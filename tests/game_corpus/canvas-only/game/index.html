<!doctype html><html><head><meta charset="utf-8"><title>Canvas Only Agency</title><style>html,body{margin:0;background:#090914;color:#fff;font:16px system-ui}body{display:grid;place-items:center;min-height:100vh;text-align:center}canvas{display:block;border:1px solid #777;background:#111;margin:auto}</style></head><body><div><canvas id="game" width="480" height="270"></canvas><p>WASD / Arrows / Space · Move the unicorn mark</p></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),started=performance.now();let px=90,py=135,score=0,actions=0,last=null,core=0;const log=[];
function now(){return performance.now()-started}function ev(type){log.push({type,at_ms:now()});if(log.length>256)log.shift()}
function draw(){x.fillStyle='#111';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#555';x.beginPath();x.moveTo(40,135);x.lineTo(440,135);x.stroke();x.fillStyle='#fff';x.font='18px system-ui';x.fillText('CANVAS-ONLY AGENCY',138,42);x.fillStyle='#ffdc6a';x.beginPath();x.moveTo(px,py-18);x.lineTo(px-10,py+12);x.lineTo(px+10,py+12);x.closePath();x.fill();x.strokeStyle='#8ff';x.beginPath();x.moveTo(40,190);x.lineTo(40+Math.min(400,score*20),190);x.stroke()}
function act(){actions++;last=now();score++;core++;px=90+Math.min(330,score*24);py=135+(score%2?12:-12);ev('action_accepted');ev('core_mechanic_activation');ev('progress_change');draw()}
const keys=new Set(['w','a','s','d','ArrowUp','ArrowLeft','ArrowDown','ArrowRight',' ']);addEventListener('keydown',e=>{if(keys.has(e.key)){e.preventDefault();act()}});ev('run_start');draw();
window.__GAME_ENGINE_TELEMETRY__={schema_version:'0.1',snapshot:()=>{const t=now();return{elapsed_ms:t,tick:Math.floor(t/16.6667),state:'playing',alive:true,game_over:false,score,progress:Math.min(1,score/10),restart_count:0,entity_count:1,action_count:actions,last_action_ms:last,core_mechanic_activations:core,progression_transitions:0,state_hash:`playing:${score}:${px}:${py}`}},events:()=>log.slice()};
</script></body></html>
