<!doctype html><html><head><meta charset="utf-8"><title>Telemetry Good</title><style>html,body{margin:0;background:#080815;color:#fff;font:16px system-ui}body{display:grid;place-items:center;min-height:100vh}#wrap{text-align:center}canvas{border:1px solid #888;background:#111}#hud{margin:8px}</style></head><body><div id="wrap"><canvas id="game" width="480" height="270"></canvas><div id="hud">Score 0 · WASD / Arrows / Space</div></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),hud=document.getElementById('hud');
const started=performance.now();let score=0,actions=0,lastAction=null,core=0,progression=0,restarts=0;const log=[];
function now(){return performance.now()-started}function event(type){log.push({type,at_ms:now()});if(log.length>256)log.splice(0,log.length-256)}
function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#111';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(240,135,62,0,7);x.stroke();x.fillStyle=`hsl(${(score*37)%360} 90% 65%)`;x.beginPath();x.arc(240+Math.sin(score)*42,135+Math.cos(score)*42,14,0,7);x.fill();x.fillStyle='#fff';x.font='18px system-ui';x.fillText('UNICORN TETHER LAB',145,38);hud.textContent=`Score ${score} · WASD / Arrows / Space`}
function act(){actions++;lastAction=now();score+=5;core++;event('action_accepted');event('core_mechanic_activation');event('progress_change');if(score===25){progression++;event('progression_transition')}draw()}
const keys=new Set(['w','a','s','d','ArrowUp','ArrowLeft','ArrowDown','ArrowRight',' ']);addEventListener('keydown',e=>{if(keys.has(e.key)){e.preventDefault();act()}});event('run_start');draw();
window.__GAME_ENGINE_TELEMETRY__={schema_version:'0.1',snapshot:()=>{const elapsed=now();return{elapsed_ms:elapsed,tick:Math.floor(elapsed/16.6667),state:'playing',alive:true,game_over:false,score,progress:Math.min(1,score/50),restart_count:restarts,entity_count:2,action_count:actions,last_action_ms:lastAction,core_mechanic_activations:core,progression_transitions:progression,state_hash:`playing:${score}:${core}:${progression}`}},events:()=>log.slice()};
</script></body></html>
